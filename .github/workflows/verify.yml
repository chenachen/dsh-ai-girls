name: Verify

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run test:native
      - if: runner.os == 'Windows'
        run: npm run test:windows
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        with:
          name: ai-girls-plugin-${{ runner.os }}-${{ runner.arch }}
          path: dist/packages/*.tgz
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
      - name: Publish complete plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ai-girls-plugin-*' --dir packages
          for package in packages/*/*.tgz; do
            (cd "$(dirname "$package")" && sha256sum "$(basename "$package")")
          done > packages/SHA256SUMS.txt
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${args[@]}" packages/*/*.tgz packages/SHA256SUMS.txt
