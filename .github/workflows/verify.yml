name: Verify

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run test:native
      - if: runner.os == 'macOS'
        run: tar -czf dist/ai-girls-macos.tar.gz -C dist AiGirls.Desktop.app
      - uses: actions/upload-artifact@v7
        with:
          name: ai-girls-desktop-${{ runner.os }}
          path: |
            dist/AiGirls.Desktop.exe
            dist/LICENSE
            dist/assets/**
            dist/ai-girls-macos.tar.gz
          retention-days: 7
